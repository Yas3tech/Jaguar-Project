# MQTT -> InfluxDB. Kort flush-interval zodat Grafana bijna live blijft.
[agent]
  interval = "1s"
  flush_interval = "500ms"
  flush_jitter = "0s"
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  omit_hostname = true

# Eén IMU-sample per bericht (50 Hz). ts = unix-tijd in ms, uniek per sample.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["jaguar/imu"]
  client_id = "telegraf-imu"
  name_override = "imu"
  topic_tag = ""
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  tag_keys = ["rit"]
  json_string_fields = ["fase", "gebeurtenis"]

# Motorstatus, max. 2 per seconde.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["jaguar/status"]
  client_id = "telegraf-status"
  name_override = "status"
  topic_tag = ""
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  tag_keys = ["rit"]
  json_string_fields = ["fase"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "jaguar-lokaal-token"
  organization = "jaguar"
  bucket = "ritten"
