# Live dashboard: robot-script -> Mosquitto (MQTT) -> Telegraf -> InfluxDB -> Grafana
# Starten:  docker compose up -d   (in deze map)   ·   Grafana: http://localhost:3000
# Alles draait lokaal; haal de images op zolang je internet hebt (docker compose pull).
name: jaguar

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports: ["1884:1883"]   # 1883 is op deze pc al bezet door de Windows-dienst mosquitto
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: jaguar
      DOCKER_INFLUXDB_INIT_PASSWORD: jaguar-robot
      DOCKER_INFLUXDB_INIT_ORG: jaguar
      DOCKER_INFLUXDB_INIT_BUCKET: ritten
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: jaguar-lokaal-token   # alleen lokaal gebruikt
    volumes: ["influxdb-data:/var/lib/influxdb2"]
    restart: unless-stopped

  telegraf:
    image: telegraf:1.32
    volumes: ["./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro"]
    depends_on: [mosquitto, influxdb]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # geen login nodig op deze laptop
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s      # standaard is 5 s het minimum
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"     # camerapaneel (HTML met <img>); alleen lokaal
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jaguar.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [influxdb]
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
